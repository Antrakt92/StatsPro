name: Package and release

on:
  # Publishing is tag-only. Only a protocol-owned empty pre-upload draft may resume.
  push:
    tags:
      - 'v*'

concurrency:
  # WARNING: the default single pending slot drops an older queued tag. Keep
  # every publication attempt serialized so marketplace uploads never overlap.
  group: statspro-release-publication
  queue: max

jobs:
  preflight:
    if: ${{ github.event.created == true && github.event.forced == false && github.event.deleted == false }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify anonymous checkout boundary
        shell: pwsh
        run: ./scripts/check-anonymous-checkout.ps1

      - name: Check CI action refs
        shell: pwsh
        run: .\scripts\report-ci-action-refs.ps1 -EnforcePinnedWorkflowRefs

      - name: Check release ancestry
        shell: pwsh
        run: .\scripts\check-release-ancestry.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Check release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: .\scripts\check-release-version.ps1 -Tag $env:GITHUB_REF_NAME -EnforceSemVer -VerifyPublishedChangelog -Repository $env:GITHUB_REPOSITORY

      - name: Lua checks
        shell: pwsh
        run: .\scripts\check-lua.ps1 -Release -ArchonMaxAgeDays 3 -EnforceToolLocks

      - name: Trim release changelog
        shell: pwsh
        run: .\scripts\check-release-version.ps1 -Tag $env:GITHUB_REF_NAME -EnforceSemVer -ExportTopChangelogPath CHANGELOG.md

      - name: Validate interrupted release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          .\scripts\manage-github-release.ps1 `
            -Mode ValidateStart `
            -Repository $env:GITHUB_REPOSITORY `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedCommitSha $env:GITHUB_SHA `
            -NotesPath CHANGELOG.md

  package:
    needs: preflight
    if: ${{ github.event.created == true && github.event.forced == false && github.event.deleted == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-candidate.outputs.artifact-id }}
      archive_sha256: ${{ steps.create-candidate.outputs.archive_sha256 }}
      candidate_sha256: ${{ steps.create-candidate.outputs.candidate_sha256 }}
      project_version: ${{ steps.rebuild-package-output.outputs.project_version }}
      run_attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify anonymous checkout boundary
        shell: pwsh
        run: ./scripts/check-anonymous-checkout.ps1

      - name: Trim release changelog
        shell: pwsh
        run: ./scripts/check-release-version.ps1 -Tag $env:GITHUB_REF_NAME -EnforceSemVer -ExportTopChangelogPath CHANGELOG.md

      - name: Install release validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Build package without publishing
        uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28
        with:
          args: -d

      - name: Resolve initial package output
        id: build-package-output
        shell: pwsh
        run: ./scripts/resolve-packager-output.ps1 -ExpectedTag $env:GITHUB_REF_NAME -OutputPath $env:GITHUB_OUTPUT

      - name: Validate initial package artifact
        shell: pwsh
        env:
          STATSPRO_ARCHIVE_PATH: ${{ steps.build-package-output.outputs.archive_path }}
          STATSPRO_PROJECT_VERSION: ${{ steps.build-package-output.outputs.project_version }}
        run: |
          ./scripts/check-package-dry-run.ps1 `
            -ArchivePath $env:STATSPRO_ARCHIVE_PATH `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -PackagerProjectVersion $env:STATSPRO_PROJECT_VERSION `
            -PackageRoot (Join-Path ".release" "StatsPro") `
            -ManifestPath (Join-Path ".release" "statspro-package-tree.sha256") `
            -ArchonMaxAgeDays 3 `
            -RequireExactPackagerProjectVersion `
            -EnforceToolLocks

      - name: Recheck release ancestry before final package build
        shell: pwsh
        run: ./scripts/check-release-ancestry.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Rebuild package without publishing
        uses: BigWigsMods/packager@6d50adb6e8517eefef63f4afb16a6518166a6b28
        with:
          args: -e -d

      - name: Resolve final package output
        id: rebuild-package-output
        shell: pwsh
        run: ./scripts/resolve-packager-output.ps1 -ExpectedTag $env:GITHUB_REF_NAME -OutputPath $env:GITHUB_OUTPUT

      - name: Compare and validate final package artifact
        shell: pwsh
        env:
          STATSPRO_ARCHIVE_PATH: ${{ steps.rebuild-package-output.outputs.archive_path }}
          STATSPRO_PROJECT_VERSION: ${{ steps.rebuild-package-output.outputs.project_version }}
        run: |
          ./scripts/check-package-dry-run.ps1 `
            -ArchivePath $env:STATSPRO_ARCHIVE_PATH `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -PackagerProjectVersion $env:STATSPRO_PROJECT_VERSION `
            -PackageRoot (Join-Path ".release" "StatsPro") `
            -CompareManifestPath (Join-Path ".release" "statspro-package-tree.sha256") `
            -ArchonMaxAgeDays 3 `
            -RequireExactPackagerProjectVersion `
            -EnforceToolLocks

      - name: Create and validate release metadata
        shell: pwsh
        env:
          STATSPRO_ARCHIVE_PATH: ${{ steps.rebuild-package-output.outputs.archive_path }}
          STATSPRO_PROJECT_VERSION: ${{ steps.rebuild-package-output.outputs.project_version }}
        run: |
          ./scripts/check-release-artifact.ps1 `
            -ZipPath $env:STATSPRO_ARCHIVE_PATH `
            -ReleaseJsonPath (Join-Path ".release" "release.json") `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -PackagerProjectVersion $env:STATSPRO_PROJECT_VERSION `
            -RequireExactPackagerProjectVersion `
            -WithReleaseJson `
            -WriteReleaseJson `
            -ArchonMaxAgeDays 3 `
            -EnforceToolLocks

      - name: Create exact release candidate
        id: create-candidate
        shell: pwsh
        env:
          STATSPRO_ARCHIVE_PATH: ${{ steps.rebuild-package-output.outputs.archive_path }}
          STATSPRO_PROJECT_VERSION: ${{ steps.rebuild-package-output.outputs.project_version }}
        run: |
          ./scripts/release-candidate.ps1 `
            -Mode Create `
            -Repository $env:GITHUB_REPOSITORY `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedCommitSha $env:GITHUB_SHA `
            -ExpectedRunId $env:GITHUB_RUN_ID `
            -ExpectedRunAttempt $env:GITHUB_RUN_ATTEMPT `
            -ExpectedProjectVersion $env:STATSPRO_PROJECT_VERSION `
            -ArchivePath $env:STATSPRO_ARCHIVE_PATH `
            -ReleaseJsonPath (Join-Path ".release" "release.json") `
            -ManifestPath (Join-Path ".release" "statspro-package-tree.sha256") `
            -CandidatePath (Join-Path ".release" "statspro-release-candidate.json") `
            -OutputPath $env:GITHUB_OUTPUT

      - name: Upload exact release candidate
        id: upload-candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: statspro-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.create-candidate.outputs.archive_path }}
            ${{ steps.create-candidate.outputs.release_json_path }}
            ${{ steps.create-candidate.outputs.manifest_path }}
            ${{ steps.create-candidate.outputs.candidate_path }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: true
          retention-days: 35

  github-prepare:
    needs: package
    if: ${{ github.event.created == true && github.event.forced == false && github.event.deleted == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify anonymous checkout boundary
        shell: pwsh
        run: ./scripts/check-anonymous-checkout.ps1

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: .release/handoff
          digest-mismatch: error

      - name: Verify exact release candidate
        id: verify-candidate
        shell: pwsh
        run: |
          ./scripts/release-candidate.ps1 `
            -Mode Verify `
            -Repository $env:GITHUB_REPOSITORY `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedCommitSha $env:GITHUB_SHA `
            -ExpectedRunId $env:GITHUB_RUN_ID `
            -ExpectedRunAttempt '${{ needs.package.outputs.run_attempt }}' `
            -ExpectedProjectVersion '${{ needs.package.outputs.project_version }}' `
            -CandidatePath (Join-Path ".release" "handoff" "statspro-release-candidate.json") `
            -ExpectedCandidateSha256 '${{ needs.package.outputs.candidate_sha256 }}' `
            -OutputPath $env:GITHUB_OUTPUT

      - name: Prepare resumable draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/manage-github-release.ps1 `
            -Mode CreateDraft `
            -Repository $env:GITHUB_REPOSITORY `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedCommitSha $env:GITHUB_SHA `
            -ExpectedRunId $env:GITHUB_RUN_ID `
            -ExpectedRunAttempt '${{ needs.package.outputs.run_attempt }}' `
            -ExpectedArchiveSha256 '${{ needs.package.outputs.archive_sha256 }}' `
            -ExpectedCandidateSha256 '${{ needs.package.outputs.candidate_sha256 }}' `
            -NotesPath '${{ steps.verify-candidate.outputs.notes_path }}' `
            -ManifestPath '${{ steps.verify-candidate.outputs.manifest_path }}'

  marketplace-upload:
    needs: [package, github-prepare]
    environment: marketplace-release
    if: ${{ github.event.created == true && github.event.forced == false && github.event.deleted == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify anonymous checkout boundary
        shell: pwsh
        run: ./scripts/check-anonymous-checkout.ps1

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: .release/handoff
          digest-mismatch: error

      - name: Verify exact release candidate
        id: verify-candidate
        shell: pwsh
        run: |
          ./scripts/release-candidate.ps1 `
            -Mode Verify `
            -Repository $env:GITHUB_REPOSITORY `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedCommitSha $env:GITHUB_SHA `
            -ExpectedRunId $env:GITHUB_RUN_ID `
            -ExpectedRunAttempt '${{ needs.package.outputs.run_attempt }}' `
            -ExpectedProjectVersion '${{ needs.package.outputs.project_version }}' `
            -CandidatePath (Join-Path ".release" "handoff" "statspro-release-candidate.json") `
            -ExpectedCandidateSha256 '${{ needs.package.outputs.candidate_sha256 }}' `
            -ArchonMaxAgeDays 3 `
            -OutputPath $env:GITHUB_OUTPUT

      - name: Require fresh package attempt before marketplace publication
        shell: pwsh
        env:
          STATSPRO_PACKAGE_RUN_ATTEMPT: ${{ needs.package.outputs.run_attempt }}
        run: |
          if ($env:GITHUB_RUN_ATTEMPT -cne $env:STATSPRO_PACKAGE_RUN_ATTEMPT) {
            throw "Marketplace publication cannot reuse a package from an earlier run attempt. Re-run all jobs to create a fresh candidate."
          }

      - name: Verify immutable release policy
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
        shell: pwsh
        run: ./scripts/check-repository-settings.ps1 -Repository $env:GITHUB_REPOSITORY -ImmutableReleasePolicyOnly -RequireExplicitToken

      - name: Prepare exact marketplace publication plan
        id: prepare-marketplace
        shell: pwsh
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
        run: |
          ./scripts/publish-marketplaces.ps1 `
            -Mode Prepare `
            -ArchivePath '${{ steps.verify-candidate.outputs.archive_path }}' `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedSha256 '${{ needs.package.outputs.archive_sha256 }}' `
            -PlanPath (Join-Path ".release" "handoff" "statspro-marketplace-plan.json") `
            -OutputPath $env:GITHUB_OUTPUT

      - name: Mark marketplace publication started
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/manage-github-release.ps1 `
            -Mode MarkMarketplaceStarted `
            -Repository $env:GITHUB_REPOSITORY `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedCommitSha $env:GITHUB_SHA `
            -ExpectedRunId $env:GITHUB_RUN_ID `
            -ExpectedRunAttempt '${{ needs.package.outputs.run_attempt }}' `
            -ExpectedArchiveSha256 '${{ needs.package.outputs.archive_sha256 }}' `
            -ExpectedCandidateSha256 '${{ needs.package.outputs.candidate_sha256 }}' `
            -NotesPath '${{ steps.verify-candidate.outputs.notes_path }}' `
            -ManifestPath '${{ steps.verify-candidate.outputs.manifest_path }}'

      - name: Publish exact archive to marketplaces
        shell: pwsh
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
        run: |
          ./scripts/publish-marketplaces.ps1 `
            -Mode Publish `
            -ArchivePath '${{ steps.verify-candidate.outputs.archive_path }}' `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedSha256 '${{ needs.package.outputs.archive_sha256 }}' `
            -PlanPath '${{ steps.prepare-marketplace.outputs.plan_path }}' `
            -ExpectedPlanSha256 '${{ steps.prepare-marketplace.outputs.plan_sha256 }}'

  github-finalize:
    needs: [package, marketplace-upload]
    if: ${{ github.event.created == true && github.event.forced == false && github.event.deleted == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify anonymous checkout boundary
        shell: pwsh
        run: ./scripts/check-anonymous-checkout.ps1

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: .release/handoff
          digest-mismatch: error

      - name: Verify exact release candidate
        id: verify-candidate
        shell: pwsh
        run: |
          ./scripts/release-candidate.ps1 `
            -Mode Verify `
            -Repository $env:GITHUB_REPOSITORY `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedCommitSha $env:GITHUB_SHA `
            -ExpectedRunId $env:GITHUB_RUN_ID `
            -ExpectedRunAttempt '${{ needs.package.outputs.run_attempt }}' `
            -ExpectedProjectVersion '${{ needs.package.outputs.project_version }}' `
            -CandidatePath (Join-Path ".release" "handoff" "statspro-release-candidate.json") `
            -ExpectedCandidateSha256 '${{ needs.package.outputs.candidate_sha256 }}' `
            -OutputPath $env:GITHUB_OUTPUT

      - name: Attach validated assets to draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/manage-github-release.ps1 `
            -Mode AttachAssets `
            -Repository $env:GITHUB_REPOSITORY `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedCommitSha $env:GITHUB_SHA `
            -ExpectedRunId $env:GITHUB_RUN_ID `
            -ExpectedRunAttempt '${{ needs.package.outputs.run_attempt }}' `
            -ExpectedArchiveSha256 '${{ needs.package.outputs.archive_sha256 }}' `
            -ExpectedCandidateSha256 '${{ needs.package.outputs.candidate_sha256 }}' `
            -ArchivePath '${{ steps.verify-candidate.outputs.archive_path }}' `
            -ReleaseJsonPath '${{ steps.verify-candidate.outputs.release_json_path }}' `
            -NotesPath '${{ steps.verify-candidate.outputs.notes_path }}' `
            -ManifestPath '${{ steps.verify-candidate.outputs.manifest_path }}'

      - name: Publish immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/manage-github-release.ps1 `
            -Mode Publish `
            -Repository $env:GITHUB_REPOSITORY `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -ExpectedCommitSha $env:GITHUB_SHA `
            -ExpectedRunId $env:GITHUB_RUN_ID `
            -ExpectedRunAttempt '${{ needs.package.outputs.run_attempt }}' `
            -ExpectedArchiveSha256 '${{ needs.package.outputs.archive_sha256 }}' `
            -ExpectedCandidateSha256 '${{ needs.package.outputs.candidate_sha256 }}' `
            -ArchivePath '${{ steps.verify-candidate.outputs.archive_path }}' `
            -ReleaseJsonPath '${{ steps.verify-candidate.outputs.release_json_path }}' `
            -NotesPath '${{ steps.verify-candidate.outputs.notes_path }}' `
            -ManifestPath '${{ steps.verify-candidate.outputs.manifest_path }}'

  verify:
    needs: github-finalize
    if: ${{ github.event.created == true && github.event.forced == false && github.event.deleted == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify anonymous checkout boundary
        shell: pwsh
        run: ./scripts/check-anonymous-checkout.ps1

      - name: Install release validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate published immutable release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assetDir = Join-Path $env:RUNNER_TEMP "statspro-release-assets"
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null

          function Save-ReleaseAsset {
            param([string]$Name)

            $path = Join-Path $assetDir $Name
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              $output = @(gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $Name --dir $assetDir --clobber 2>&1)
              if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $path -PathType Leaf)) {
                return $path
              }
              Write-Host "Release asset $Name not ready on attempt $attempt`: $($output -join ' ')"
              if ($attempt -lt 6) {
                Start-Sleep -Seconds ([Math]::Min(60, 5 * [Math]::Pow(2, $attempt - 1)))
              }
            }
            throw "Release asset $Name was not downloadable after retries."
          }

          $zipPath = Save-ReleaseAsset -Name "StatsPro-$tag.zip"
          $releaseJsonPath = Save-ReleaseAsset -Name "release.json"
          ./scripts/check-release-artifact.ps1 `
            -ZipPath $zipPath `
            -ReleaseJsonPath $releaseJsonPath `
            -ExpectedTag $tag `
            -PackagerProjectVersion $tag `
            -RequireExactPackagerProjectVersion `
            -WithReleaseJson `
            -ArchonMaxAgeDays 3 `
            -EnforceToolLocks
